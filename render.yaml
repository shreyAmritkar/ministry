services:
  - type: web
    name: civic-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Server Configuration
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://frontend-eight-topaz-74.vercel.app

      # Database
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: civictrack

      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_COOKIE_EXPIRE
        value: 7

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Email (Optional - can disable for free tier)
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: noreply@civictrack.com

      # File Upload Limits
      - key: MAX_IMAGE_SIZE
        value: 5242880
      - key: MAX_VIDEO_SIZE
        value: 52428800
      - key: MAX_GRIDFS_VIDEO_SIZE
        value: 104857600

      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100

      # CORS
      - key: ALLOWED_ORIGINS
        value: https://frontend-eight-topaz-74.vercel.app

      # Geospatial
      - key: DEFAULT_SEARCH_RADIUS
        value: 5000
      - key: MAX_SEARCH_RADIUS
        value: 50000

      # AI API (Gemini)
      - key: GEMINI_API_KEY
        sync: false

      # Redis (Upstash)
      - key: REDIS_URL
        sync: false

    healthCheckPath: /api/health
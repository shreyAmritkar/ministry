version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: civictrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app-network

  backend:
    image: shrey89/ministry-backend:latest
    container_name: civictrack-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - redis
    networks:
      - app-network

  frontend:
    image: shrey89/ministry-frontend:latest
    container_name: civictrack-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend_uploads:
  redis_data:
version: '3.8'

services:
  # ============================================
  # PostgreSQL (primary datastore: users, reports, tenures, notifications)
  # ============================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: civictrack-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-civictrack}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-civictrack}
      - POSTGRES_DB=${POSTGRES_DB:-civictrack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civictrack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend Service
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civictrack-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - CLIENT_URL=${CLIENT_URL}
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civictrack}}
      - DB_USER=${DB_USER:-${POSTGRES_USER:-civictrack}}
      - DB_PASSWORD=${DB_PASSWORD:-${POSTGRES_PASSWORD:-civictrack}}
      - DB_SSL=${DB_SSL:-false}
      # Kept only for GridFS video storage — see the migration decision to
      # leave file storage where it was.
      - MONGODB_URI=${MONGODB_URI}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRE=${JWT_ACCESS_EXPIRE}
      - JWT_REFRESH_EXPIRE_DAYS=${JWT_REFRESH_EXPIRE_DAYS}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - EMAIL_SERVICE=${EMAIL_SERVICE}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - MAX_IMAGE_SIZE=${MAX_IMAGE_SIZE}
      - MAX_VIDEO_SIZE=${MAX_VIDEO_SIZE}
      - MAX_GRIDFS_VIDEO_SIZE=${MAX_GRIDFS_VIDEO_SIZE}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - DEFAULT_SEARCH_RADIUS=${DEFAULT_SEARCH_RADIUS}
      - MAX_SEARCH_RADIUS=${MAX_SEARCH_RADIUS}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - REDIS_URL=${REDIS_URL}
    networks:
      - app-network
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://backend:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================
  # Frontend Service
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: civictrack-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - DOCKER_ENV=true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend_uploads:
  postgres_data:

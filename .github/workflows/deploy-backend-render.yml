name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-render.yml"
  workflow_dispatch: {}

# Avoid overlapping deploys if pushes land close together
concurrency:
  group: deploy-backend-render
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civictrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply schema to test database
        run: node db/migrate.js
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/civictrack_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSL: "false"

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set. Create a Deploy Hook in Render (Settings > Deploy Hook) and add it as a repo secret."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for Render to report healthy
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        if: ${{ env.HEALTH_URL != '' }}
        run: |
          echo "Waiting for $HEALTH_URL to respond..."
          for i in $(seq 1 20); do
            if curl -fsS "$HEALTH_URL" > /dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            echo "Not ready yet ($i/20), retrying in 15s..."
            sleep 15
          done
          echo "::warning::Health check did not succeed in time; check the Render dashboard."
